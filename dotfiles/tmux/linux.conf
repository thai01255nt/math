# Linux: Wayland -> wl-copy (wl-clipboard), X11 -> xclip.
# Bien moi truong lay tu luc tmux server khoi dong.
set -s copy-command 'if [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null; then wl-copy; elif command -v xclip >/dev/null; then xclip -selection clipboard; else cat >/dev/null; fi'
